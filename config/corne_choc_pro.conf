# Enable mouse emulation.
CONFIG_ZMK_POINTING=y

# Change idle settings
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep settings
# Debugging: after deep sleep a half doesn't wake up on key presses or the power switch,
# only plugging in USB brings it back. Sleep after 2 s to reproduce it quickly.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2000

# Custom keyboard name (max. 16 characters)
# CONFIG_ZMK_KEYBOARD_NAME="My Keyboard"
